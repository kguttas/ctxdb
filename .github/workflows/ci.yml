name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .

      - name: Engine tests
        run: python tests/test_ctxdb.py

      - name: Vector branch tests
        run: python tests/test_vector.py

      # Spawns real processes writing to one file, so it is the only suite that can
      # catch a regression in how long the write lock is held.
      - name: Concurrency tests
        run: python tests/test_concurrent.py
